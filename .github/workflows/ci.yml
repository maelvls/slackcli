name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs of a PR share one group, so a new push cancels the run it supersedes.
# Any other run gets a group of its own (its run ID): a shared group would
# still cancel a pending push to main when the next one arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt, vet, cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check
      - run: make vet
      - run: make cross-build

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-race

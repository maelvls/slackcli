name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each kind of check has its own job, so that one failing does not hide
# the result of the others.
jobs:
  test:
    name: Build, vet, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  race:
    name: Race detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race ./...

  lint:
    name: Format, modules, shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        if: ${{ !cancelled() }}
        run: |
          unformatted="$(gofmt -l cmd internal .github)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy
        if: ${{ !cancelled() }}
        run: go mod tidy -diff

      - name: install.sh is valid POSIX sh
        if: ${{ !cancelled() }}
        run: sh -n install.sh

      - name: shellcheck
        if: ${{ !cancelled() }}
        run: shellcheck install.sh scripts/install-skill.sh

  release-config:
    name: Release configuration and archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # as in release.yml: GoReleaser reads the tags

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      # Builds every release target (the cross-compile check) and packages
      # it exactly as a release would, without publishing anything.
      - name: Build the release archives (snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      # Self-update and install.sh download these archives by name; see the
      # "Release naming contract" in AGENTS.md.
      - name: The archives are the ones self-update and install.sh download
        run: |
          go vet ./.github/scripts/checkdist
          go run ./.github/scripts/checkdist dist
